name: CI

on:
  push:
    branches: [ master, develop, feature/*, features/* ]
  pull_request:
    branches: [ master, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    services:
      mongodb:
        # TODO: back to mongo:8 once it starts on the GitHub runners again. Since 2026-10-19 mongod 8
        #       exits on start with "Linux kernel versions 6.19 and newer has a known incompatibility
        #       with this version of MongoDB" (https://jira.mongodb.org/browse/SERVER-121912).
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install grunt-cli
        run: npm install -g grunt-cli

      - name: Run linting
        run: grunt

      - name: Run tests
        if: github.ref != 'refs/heads/master'
        run: grunt test

      - name: Run coverage
        if: github.ref == 'refs/heads/master'
        run: grunt coverage
